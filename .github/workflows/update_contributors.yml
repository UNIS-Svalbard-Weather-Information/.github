name: Update Contributors

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:    # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the GitHub App key. Restrict this environment to the main branch in the
    # repository settings, otherwise any branch could carry a workflow that reads it.
    environment: contributors
    permissions:
      contents: write # commits the regenerated profile README and contributors.json
    steps:
      - name: Checkout repository  # zizmor: ignore[artipacked] credentials needed: the last step runs git push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests==2.34.2

      # The default token only sees this (public) repository. To include the private
      # repositories, install a GitHub App with read-only Metadata on them and set the
      # CONTRIBUTORS_APP_CLIENT_ID variable and CONTRIBUTORS_APP_KEY secret; until then
      # the run falls back to the public repositories. The token lives for one hour.
      - name: Create a token that can read the private repositories
        id: app-token
        if: ${{ vars.CONTRIBUTORS_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONTRIBUTORS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONTRIBUTORS_APP_KEY }}
          # Without `owner` the token is scoped to this repository only
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Fetch and update contributors
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: |
          python - <<'EOF'
          import os
          import requests
          import json

          os.makedirs("profile", exist_ok=True)

          org = os.getenv("ORG_NAME")
          token = os.getenv("GITHUB_TOKEN")
          headers = {"Authorization": f"token {token}"}

          def fetch_pages(url, strict):
              """All pages of a GitHub list endpoint. With strict, any error status fails the
              run instead of being treated as an empty list."""
              items, page = [], 1
              while True:
                  response = requests.get(f"{url}?per_page=100&page={page}", headers=headers, timeout=30)
                  if response.status_code != 200:
                      if strict:
                          response.raise_for_status()
                      return items
                  batch = response.json()
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
                  page += 1

          # Fetch all repositories in the organization (every page; an API error fails the run)
          repos = fetch_pages(f"https://api.github.com/orgs/{org}/repos", strict=True)

          # Bots are identified two ways:
          # 1. GitHub's own contributor "type" field == "Bot" - catches genuine GitHub
          #    Apps (dependabot[bot], renovate[bot], the real github-actions[bot] identity).
          # 2. An explicit KNOWN_BOT_LOGINS list - needed because several automation
          #    accounts in this org are plain GitHub *users*, not registered Apps, so
          #    GitHub reports their type as "User" like any human (confirmed directly:
          #    actions-user and snyk-bot both still showed up as regular contributors
          #    when only the type field was checked). Add any future one here by login.
          #
          # ALLOWED_BOT_LOGINS is the only thing that decides what actually gets shown in
          # the Bots table - everything else classified as a bot (either way, above) is
          # dropped from both outputs entirely, not just hidden from the README.
          KNOWN_BOT_LOGINS = {"actions-user", "snyk-bot", "github-actions", "github-actions[bot]"}
          ALLOWED_BOT_LOGINS = {"polar-worker"}

          def is_bot(contributor):
              login = contributor["login"]
              return (
                  contributor.get("type") == "Bot"
                  or login in KNOWN_BOT_LOGINS
                  or login in ALLOWED_BOT_LOGINS
              )

          # Private repositories: the About page and the README are public. A private
          # repository is listed by name only if that name is already public knowledge;
          # all the others are merged into one anonymous entry. The address of a private
          # repository would 404 for visitors, and the About page needs a url for every
          # entry, so these entries link to the organisation page.
          PUBLIC_PRIVATE_NAMES = {"swi-frontend"}
          PRIVATE_GROUP = "Private repositories"
          ORG_URL = f"https://github.com/{org}"
          private_seen = 0

          contributors = {}
          bots = {}
          repo_contributions = {}  # {repo_name: total_contributions}, shown entries only

          for repo in repos:
              api_name = repo["name"]
              if repo.get("private"):
                  private_seen += 1
                  repo_name = api_name if api_name in PUBLIC_PRIVATE_NAMES else PRIVATE_GROUP
                  repo_html_url = ORG_URL
              else:
                  repo_name = api_name
                  repo_html_url = repo["html_url"]
              contributors_url = f"https://api.github.com/repos/{org}/{api_name}/contributors"
              repo_contribs = fetch_pages(contributors_url, strict=False)
              if repo_contribs:

                  for contributor in repo_contribs:
                      login = contributor["login"]

                      if is_bot(contributor):
                          if login not in ALLOWED_BOT_LOGINS:
                              continue
                          target = bots
                      else:
                          target = contributors

                      contributions = contributor["contributions"]
                      repo_contributions[repo_name] = repo_contributions.get(repo_name, 0) + contributions

                      if login not in target:
                          target[login] = {
                              "html_url": contributor["html_url"],
                              "avatar_url": contributor["avatar_url"],
                              "repos": {},
                              "contributions": 0
                          }
                      if repo_name not in target[login]["repos"]:
                          target[login]["repos"][repo_name] = {
                              "url": repo_html_url,
                              "contributions": 0
                          }
                      target[login]["repos"][repo_name]["contributions"] += contributions
                      target[login]["contributions"] += contributions

          # Now, calculate the percentage for each contributor per repo (both groups)
          for group in (contributors, bots):
              for login in group:
                  for repo_name in group[login]["repos"]:
                      total_repo_contribs = repo_contributions[repo_name]
                      user_repo_contribs = group[login]["repos"][repo_name]["contributions"]
                      percentage = (user_repo_contribs / total_repo_contribs) * 100
                      group[login]["repos"][repo_name]["percentage"] = round(percentage, 2)

          # Sort each group by total contributions in descending order
          sorted_contributors = sorted(contributors.items(), key=lambda x: x[1]["contributions"], reverse=True)
          sorted_bots = sorted(bots.items(), key=lambda x: x[1]["contributions"], reverse=True)

          def write_table(f, entries):
              f.write("| Avatar | Username | Repositories | Contributions |\n|---------|-----------|-----------------|-----------------|\n")
              for login, info in entries:
                  repos_list = ", ".join(
                      f"[{repo_name}]({info['repos'][repo_name]['url']}) ({info['repos'][repo_name]['contributions']})"
                      for repo_name in info["repos"]
                  )
                  f.write(f"| <img src='{info['avatar_url']}' width='50'> | [{login}]({info['html_url']}) | {repos_list} | {info['contributions']} |\n")

          # Generate markdown table with introduction
          with open("profile/README.md", "w") as f:
              f.write("# Svalbard Weather Information\n\n")
              f.write("A trip planning web app for Svalbard, designed to provide real time weather information and forecast and help you plan your adventures safely and efficiently.\n\n")
              f.write("Thank you to all our contributors for your hard work and dedication!\n\n")
              f.write("Any bug report or general issues can be reported on [UNIS-Svalbard-Weather-Information/SWI](https://github.com/UNIS-Svalbard-Weather-Information/SWI).\n\n")
              f.write("## Our Contributors\n\n")
              f.write("Here is a list of our contributors, the repositories they have contributed to, and their total contributions:\n\n")
              write_table(f, sorted_contributors)

              if sorted_bots:
                  f.write("\n## Our Bots\n\n")
                  f.write("Automation that also contributes directly:\n\n")
                  write_table(f, sorted_bots)

          contribs = []
          for login, info in sorted_contributors + sorted_bots:
              infoc = info.copy()
              infoc["name"] = login
              infoc["type"] = "Bot" if login in bots else "User"
              contribs.append(infoc)

          with open('contributors.json', 'w', encoding='utf-8') as f:
              json.dump(contribs, f, ensure_ascii=False, indent=4)

          print(f"Updated profile/README.md with {len(contributors)} contributors and {len(bots)} bots ({private_seen} private repositories included).")
          if private_seen == 0:
              print("No private repository was visible: the token only sees public repositories.")

          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add profile/README.md contributors.json
          git commit -m "Update contributors list" || echo "No changes to commit"
          git push
